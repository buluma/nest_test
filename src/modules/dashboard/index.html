<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Dashboard</h1>
            <div class="controls">
                <select id="timeWindow">
                    <option value="1h">Last 1 hour</option>
                    <option value="24h" selected>Last 24 hours</option>
                    <option value="7d">Last 7 days</option>
                    <option value="30d">Last 30 days</option>
                </select>
                <button id="refreshBtn">Refresh</button>
                <span id="lastUpdated"></span>
            </div>
        </header>

        <section id="repos-section">
            <h2>Repositories</h2>
            <div id="repos-list" class="repos-list"></div>
        </section>

        <section id="prs-section">
            <h2>Pull Requests</h2>
            <div class="filters">
                <select id="prStateFilter">
                    <option value="open">Open</option>
                    <option value="closed">Closed</option>
                    <option value="all">All</option>
                </select>
                <select id="prRepoFilter">
                    <option value="">All Repos</option>
                </select>
            </div>
            <div id="prs-list" class="prs-list"></div>
        </section>

        <section id="runs-section">
            <h2>Action Runs</h2>
            <div class="filters">
                <select id="runStatusFilter">
                    <option value="completed">Completed</option>
                    <option value="in_progress">In Progress</option>
                    <option value="queued">Queued</option>
                    <option value="all">All</option>
                </select>
                <select id="runRepoFilter">
                    <option value="">All Repos</option>
                </select>
            </div>
            <div id="runs-list" class="runs-list"></div>
        </section>
    </div>
    <script src="/dashboard/app.js"></script>
</body>
</html>
